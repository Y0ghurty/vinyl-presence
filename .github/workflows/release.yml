# Push a tag like v1.2.0 and GitHub builds VinylPresence.exe and publishes it as a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install pyinstaller pillow pystray

      - name: Stamp version
        shell: bash
        run: printf 'VERSION = "%s"\nGITHUB_REPO = "%s"\n' "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > version.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name VinylPresence --icon assets/vinyl.png --add-data "assets;assets" --hidden-import pystray._win32 app.py

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/VinylPresence.exe
          generate_release_notes: true
