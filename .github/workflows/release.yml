# Push a tag like v1.2.0 and GitHub builds VinylPresence.exe and publishes it as a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install pyinstaller pillow pystray discord.py pychromecast

      - name: Stamp version
        shell: bash
        run: printf 'VERSION = "%s"\nGITHUB_REPO = "%s"\n' "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > version.py

      - name: Last.fm keys
        # From the repository's secrets (Settings > Secrets and variables > Actions), so they're never in the code.
        # Without them the app still builds; Last.fm scrobbling is just unavailable.
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: printf 'API_KEY = "%s"\nSHARED_SECRET = "%s"\n' "$LASTFM_API_KEY" "$LASTFM_SHARED_SECRET" > lastfm_keys.py

      - name: YouTube key
        # From the YOUTUBE_API_KEY repository secret. Without it, only the videos Discogs lists are used.
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: printf 'API_KEY = "%s"\n' "$YOUTUBE_API_KEY" > youtube_keys.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name VinylPresence --icon assets/vinyl.png --add-data "assets;assets" --hidden-import pystray._win32 app.py

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/VinylPresence.exe
          generate_release_notes: true
