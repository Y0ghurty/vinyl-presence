# Push a tag like v1.2.0 and GitHub builds VinylPresence.exe and publishes it as a release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Code signing through SignPath Foundation, once it's set up (see "Code signing policy" in the README).
      # Without the SIGNPATH_API_TOKEN secret the exe is published unsigned, like before.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install pyinstaller pillow pystray discord.py pychromecast

      - name: Stamp version
        shell: bash
        run: |
          printf 'VERSION = "%s"\nGITHUB_REPO = "%s"\n' "${GITHUB_REF_NAME#v}" "$GITHUB_REPOSITORY" > version.py
          python .github/version_info.py "${GITHUB_REF_NAME#v}" > version_info.txt

      - name: Last.fm keys
        # From the repository's secrets (Settings > Secrets and variables > Actions), so they're never in the code.
        # Without them the app still builds; Last.fm scrobbling is just unavailable.
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: printf 'API_KEY = "%s"\nSHARED_SECRET = "%s"\n' "$LASTFM_API_KEY" "$LASTFM_SHARED_SECRET" > lastfm_keys.py

      - name: YouTube key
        # From the YOUTUBE_API_KEY repository secret. Without it, only the videos Discogs lists are used.
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: printf 'API_KEY = "%s"\n' "$YOUTUBE_API_KEY" > youtube_keys.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name VinylPresence --icon assets/vinyl.png --version-file version_info.txt --add-data "assets;assets" --hidden-import pystray._win32 app.py

      - name: Upload unsigned exe for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: VinylPresence-unsigned
          path: dist/VinylPresence.exe
          archive: false

      - name: Sign with SignPath
        # Waits until the release is approved in SignPath, then puts the signed exe in dist/signed.
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      - name: Use the signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: mv -f dist/signed/VinylPresence.exe dist/VinylPresence.exe

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/VinylPresence.exe
          generate_release_notes: true
          body: "Download **VinylPresence.exe** below. · [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)"
